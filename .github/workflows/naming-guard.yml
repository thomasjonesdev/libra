name: naming guard

# architecture/plans/MIGRATION-NAMING.md Stage 8: the founding-vocabulary
# rename (Model→State, Msg→Action, update→reduce, Cmd→Effect,
# widget→component, tierN_→named test kinds) is complete and the deprecated
# aliases are gone. This job fails a PR that reintroduces the old names —
# architecture vault notes for §2/§3.2/§21 and MIGRATION-NAMING.md are the
# only places allowed to still say them, since they document the rename's
# history.
on:
  push:
  pull_request:

jobs:
  grep-deny-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: old names must not reenter
        run: |
          set -euo pipefail
          pattern='libra_widgets|ReflectModel|ReflectMsg|expect_cmd|assert_cmd|tier[0-9]_'
          hits=$(grep -rnIE "$pattern" . \
            --exclude-dir=.git --exclude-dir=target \
            --exclude-dir=.obsidian \
            --exclude=naming-guard.yml \
            || true)
          # Historical record lives in the architecture vault; drop those hits.
          hits=$(printf '%s\n' "$hits" | grep -vE '^\./architecture/' || true)
          if [ -n "$hits" ]; then
            echo "Old pre-rename names found outside their historical record:"
            echo "$hits"
            echo
            echo "See architecture/plans/MIGRATION-NAMING.md — Stage 8 removed these; don't reintroduce them."
            exit 1
          fi

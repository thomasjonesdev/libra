name: naming guard

# MIGRATION-NAMING.md Stage 8: the founding-vocabulary rename (Model→State,
# Msg→Action, update→reduce, Cmd→Effect, widget→component, tierN_→named
# test kinds) is complete and the deprecated aliases are gone. This job
# fails a PR that reintroduces the old names — LIBRA-ARCHITECTURE.md §2/§3.2
# and MIGRATION-NAMING.md itself are the only places allowed to still say
# them, since they document the rename's history.
on:
  push:
  pull_request:

jobs:
  grep-deny-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: old names must not reenter
        run: |
          set -euo pipefail
          pattern='libra_widgets|ReflectModel|ReflectMsg|expect_cmd|assert_cmd|tier[0-9]_'
          hits=$(grep -rnIE "$pattern" . \
            --exclude-dir=.git --exclude-dir=target \
            --exclude=LIBRA-ARCHITECTURE.md --exclude=MIGRATION-NAMING.md \
            --exclude=naming-guard.yml \
            || true)
          if [ -n "$hits" ]; then
            echo "Old pre-rename names found outside their historical record:"
            echo "$hits"
            echo
            echo "See MIGRATION-NAMING.md — Stage 8 removed these; don't reintroduce them."
            exit 1
          fi

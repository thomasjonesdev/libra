# libra.toml v1 — packaging manifest (PLAN-PACKAGE P2).
# Required for `libra package`; optional for `libra dev` (icon only).
# Window title/size stay on libra::app! for v1. See architecture/sections/20-packaging.md.

[app]
name = "AWS Login"                   # Finder / DMG display name
bundle_id = "dev.libra.aws-login"    # macOS CFBundleIdentifier
app_user_model_id = "Libra.AwsLogin" # Windows toast AppUserModelID

[package]
icon = "assets/icon.png"             # square PNG; one source for all platform icon sizes

# Optional — enables codesign + notarization in `libra package` (P4).
[package.sign.macos]
identity = "Developer ID Application: Thomas Jones (4LP57JV5FB)"
notary_profile = "libra-notary"
# provider_short_name = "YourTeamShortName"

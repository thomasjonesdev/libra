[workspace]
resolver = "2"
members = ["crates/*", "examples/counter", "examples/fetcher", "examples/dashboard", "examples/notes", "examples/gallery", "examples/todos", "applications/aws-login", "cli/libra", "conformance"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
libra = { path = "crates/libra" }
libra-core = { path = "crates/libra-core" }
libra-reflect = { path = "crates/libra-reflect" }
libra-markup = { path = "crates/libra-markup" }
libra-interp = { path = "crates/libra-interp" }
libra-components = { path = "crates/libra-components" }
libra-draw = { path = "crates/libra-draw" }
libra-raster = { path = "crates/libra-raster" }
libra-test = { path = "crates/libra-test" }
libra-platform = { path = "crates/libra-platform" }
libra-kv = { path = "crates/libra-kv" }
libra-effects = { path = "crates/libra-effects" }
libra-data = { path = "crates/libra-data" }
libra-text = { path = "crates/libra-text" }
libra-codegen = { path = "crates/libra-codegen" }
libra-build = { path = "crates/libra-build" }
libra-query = { path = "crates/libra-query" }
# Determinism-critical rendering stack — pinned exactly (§ Phase 0
# shortcuts): bumping any of these can change rendered bytes and requires
# re-blessing every snapshot.
taffy = "=0.5.2"
tiny-skia = "=0.11.4"
fontdue = "=0.8.0"

# Third-party deps, versioned once here and referenced per crate with
# `<dep>.workspace = true`. Keeps every crate on one version + one feature
# policy (notably serde, previously declared in ~9 places).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
directories = "5"
ureq = "2"
getrandom = "0.2"
redb = "2"
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
accesskit = "0.24"
accesskit_winit = "0.33"
png = "0.17"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
sha1 = "0.10"

# Paint path stays fast in plain `cargo run` / `libra dev` (§22): pixel
# loops and the pinned raster stack need LLVM opts even when the rest of
# the workspace stays opt-level 0 for fast rebuilds + debugging. `*` covers
# non-workspace deps (tiny-skia, fontdue, taffy, …); named entries cover
# workspace crates that own the hot path (`*` does not apply to members).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libra-raster]
opt-level = 2

[profile.dev.package.libra-draw]
opt-level = 2

[profile.dev.package.libra-data]
opt-level = 2

[profile.dev.package.libra-components]
opt-level = 2

[profile.dev.package.libra-platform]
opt-level = 2

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(libra_has_view_codegen)"] }

[profile.release]
lto = "thin"
codegen-units = 1

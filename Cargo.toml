[workspace]
resolver = "2"
members = ["crates/*", "examples/counter", "examples/fetcher", "examples/dashboard", "examples/notes", "examples/gallery", "examples/todos", "applications/aws-login", "applications/gloss", "applications/gloss/crates/gloss-core", "applications/gloss/crates/gloss-cli", "applications/gloss/crates/gloss-index", "cli/libra", "conformance"]
# PLAN-SDK S3: the starter is a standalone crate. Exclude it so it needs
# no dummy `[workspace]` table while living under this checkout.
exclude = ["templates/app"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/thomasjonesdev/libra"
authors = ["Thomas Jones"]

# crates.io names (PLAN-SDK S4, §26 #7): `libra`, `libra-core`, and
# `libra-cli` are taken. Publish those three as `libra-ui`,
# `libra-ui-core`, and `libra-ui-cli`. Rust names stay `libra` /
# `libra_core` via `[lib] name`, and the CLI binary stays `libra`.
[workspace.dependencies]
libra-ui = { version = "0.1.2", path = "crates/libra", default-features = false }
libra-ui-core = { version = "0.1.2", path = "crates/libra-core" }
libra-reflect = { version = "0.1.2", path = "crates/libra-reflect" }
libra-markup = { version = "0.1.2", path = "crates/libra-markup" }
libra-interp = { version = "0.1.2", path = "crates/libra-interp" }
libra-components = { version = "0.1.2", path = "crates/libra-components" }
libra-draw = { version = "0.1.2", path = "crates/libra-draw" }
libra-raster = { version = "0.1.2", path = "crates/libra-raster" }
libra-test = { version = "0.1.2", path = "crates/libra-test" }
libra-platform = { version = "0.1.2", path = "crates/libra-platform" }
libra-kv = { version = "0.1.2", path = "crates/libra-kv" }
libra-effects = { version = "0.1.2", path = "crates/libra-effects" }
libra-data = { version = "0.1.2", path = "crates/libra-data" }
libra-text = { version = "0.1.2", path = "crates/libra-text" }
libra-codegen = { version = "0.1.2", path = "crates/libra-codegen" }
libra-build = { version = "0.1.2", path = "crates/libra-build" }
libra-query = { version = "0.1.2", path = "crates/libra-query" }
libra-markdown = { version = "0.1.2", path = "crates/libra-markdown" }
pulldown-cmark = { version = "0.13", default-features = false }
# Determinism-critical rendering stack — pinned exactly (§ Phase 0
# shortcuts): bumping any of these can change rendered bytes and requires
# re-blessing every snapshot.
taffy = "=0.5.2"
tiny-skia = "=0.11.4"
fontdue = "=0.8.0"

# Third-party deps, versioned once here and referenced per crate with
# `<dep>.workspace = true`. Keeps every crate on one version + one feature
# policy (notably serde, previously declared in ~9 places).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
directories = "5"
ureq = "2"
getrandom = "0.2"
redb = "2"
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
rfd = "0.15"
muda = "0.16"
tray-icon = "0.19"
accesskit = "0.24"
accesskit_winit = "0.33"
png = "0.17"
notify-rust = "4"
image = "0.25"
icns = "0.3"
ico = "0.3"
minisign = "0.7"
minisign-verify = "0.2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
sha1 = "0.10"
blake3 = "1"
unicode-normalization = "0.1"
ropey = "1.6"
proptest = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
gloss-core = { path = "applications/gloss/crates/gloss-core" }
gloss-cli = { path = "applications/gloss/crates/gloss-cli" }
gloss-index = { path = "applications/gloss/crates/gloss-index" }
gloss = { path = "applications/gloss" }

# Paint path stays fast in plain `cargo run` / `libra dev` (§22): pixel
# loops and the pinned raster stack need LLVM opts even when the rest of
# the workspace stays opt-level 0 for fast rebuilds + debugging. `*` covers
# non-workspace deps (tiny-skia, fontdue, taffy, …); named entries cover
# workspace crates that own the hot path (`*` does not apply to members).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libra-raster]
opt-level = 2

[profile.dev.package.libra-draw]
opt-level = 2

[profile.dev.package.libra-data]
opt-level = 2

[profile.dev.package.libra-components]
opt-level = 2

[profile.dev.package.libra-platform]
opt-level = 2

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(libra_has_view_codegen)"] }

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "libra-reflect"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Dev-only cycle (permitted by cargo): the integration tests exercise the
# derive against the real traits.
[dev-dependencies]
libra-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
